name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # 1. TESTES DO BACKEND
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. TESTES E BUILD DO FRONTEND
  # ---------------------------------------------------------------------------
  test-and-build-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test

      - name: Build Frontend for Production
        run: npm run build
        env:
          VITE_API_URL: https://backend.raimaciel.workers.dev

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. DEPLOY EM PRODUCAO (Apenas push na branch main)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [test-backend, test-and-build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deploy do Backend (Cloudflare Workers + D1 + R2)
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy Backend to Cloudflare Workers
        working-directory: backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Download do dist gerado no job de build do frontend
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Deploy do Frontend (Cloudflare Pages)
      - name: Deploy Frontend to Cloudflare Pages
        working-directory: frontend
        run: npx wrangler pages deploy dist --project-name financeiro-app-6wf --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
